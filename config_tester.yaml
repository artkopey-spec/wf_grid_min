# Legacy-period tester profile for the current Si data.csv.
# Data snapshot: 173618 Si 5m OHLCV bars across 1003 trading days,
# 2023-01-03 09:00 to 2026-11-05 23:45 MSK.
# Source columns: FINAM DATE/TIME, OHLC and VOL.
# Legacy mode with period=false runs one backtest over the full dataset.
#
# Run example:
#   python run_batch_tester.py --csv data.csv --config config_tester.yaml

supertrend:
  atr_period: 18`
  multiplier: 4.0

trade_mode: revers
period: false

# Commission per transaction side (fraction).
commission: 0.0000667

warmup_period: 0
warmup_period_auto: true

periods_per_year: auto
annualization_factor: auto
annualization_basis: trading
market: futures
execution_model: open_to_open
min_trades_required: 3

early_exit:
  enabled: false
  max_drawdown: 0.50
  check_bars: 10

segmentation:
  mode: legacy
  n_parts: 8

export:
  diagnostics: true
  signals: true
  false_start: true
  cycle: true
  trades: true
  # Include one-bar trades at 5m resolution.
  false_start_max_bars: 2
  diagnostics_v2: true
  diagnostics_v2_flags:
    index: true
    reproducibility: true
    dashboard: true
    run_health: true
    trade_analytics: true
    equity_drawdown: true
    filter_funnel: true
    filter_attribution: true
    cycle_summary: true
    cost_sensitivity: true
    remediation: true
    filter_diagnostics_sampled: true
    # Reserved by the schema; these sheets are not implemented yet.
    returns_calendar: false
    exit_quality: false
    false_start_2: false
    data_dictionary: false
    robustness: false

trade_filter:
  enabled: false

  zigzag:
    enabled: false

  reversal_confirmation:
    enabled: false

  time_filter:
    enabled: false
    windows:
      - "09:00-19:00"

  volume:
    enabled: false

  wakeup_regime:
    enabled: false
