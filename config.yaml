schema_version: 1
# WF Grid profile for the current data.csv.
# Data snapshot: 105681 MIX 1m bars, 2026-03-06 09:24 to 2026-08-05 12:46 MSK.
# QUIK columns include OHLC and volume.
# WF windows: 63000 train bars / 21000 test bars / 21000 step bars (3:1, anchor=end).
# Run: python run.py --config config.yaml

data:
  file_path: "data.csv"
  periods_per_year: "auto"
  annualization_basis: "trading"

optimization:
  atr_period_range: [10, 80]
  multiplier_range: [1.0, 4.0]
  multiplier_step: 0.2
  atr_period_step: 3
  trade_mode: "revers"

backtest:
  # MIX commission per operation: 8.15 RUB / ~228275 RUB contract value.
  commission: 0.0000357025
  min_trades_required: 3
  early_exit_enabled: false
  early_exit_max_drawdown: 0.50
  early_exit_check_bars: 50

validation:
  warmup_period: 0
  warmup_period_auto: true
  walk_forward:
    train_size: "63000bars"
    test_size: "21000bars"
    step_size: "21000bars"
    scheme: "rolling"
    anchor: "end"
    min_train_bars: 63000
    min_test_bars: 21000

gates:
  step:
    min_trades: 3
    max_drawdown_threshold: -0.50
  candidate:
    positive_median_threshold: 0.0
    min_trades_median: 8.0
    worst_segment_pnl_threshold: -15.0
    max_drawdown_threshold: -0.45
    min_total_trades: 500
    min_ok_ratio: 0.80

ranking:
  mode: "gates_score"
  min_segments_for_ranking: null
  sort_by: "sum_pnl_pct_Median"
  tiebreaker: "sum_pnl_pct_Min"

scoring:
  normalization_mode: "rank"
  min_passed_for_discrimination: 10
  low_spread_threshold: 0.25
  score_weights:
    sum_pnl_pct_Median:        0.42
    profitable_segments_count: 0.34
    abs_max_drawdown_Median:   0.12
    abs_max_drawdown_Min:      0.12

status:
  min_meaningful_bars: 100

bucket:
  atr_bucket_step: 9
  mult_bucket_step: 0.6
  min_buckets_for_median: 5

execution:
  parallel_enabled: true
  max_workers: null
  chunksize: null
  fallback_to_sequential: true

export:
  retain_per_bar_filter_diagnostics: false

trade_filter:
  enabled: true

  zigzag:
    enabled: false

  time_filter:
    enabled: true
    windows:
      - "09:00-12:00"
      - "16:00-18:00"

  volume:
    enabled: false

  wakeup_regime:
    enabled: false
