# Canonical legacy-period tester profile for the production Time-only schedule.
#
# Run example:
#   python -m supertrend_optimizer.cli.tester --csv data.csv --config config_tester.yaml --out result_time_only.xlsx

supertrend:
  atr_period: 19
  multiplier: 4.0

trade_mode: revers
period: false

# MXU6 / MIX-9.26 futures cost model:
# Finam 0.45 RUB + MOEX SCALPERFEE 7.70 RUB = 8.15 RUB per side.
# Using MXU6 LAST_RUB ~= 228275 RUB: 8.15 / 228275 = 0.0000357025 per operation.
commission: 0.0000357025

warmup_period: 0
warmup_period_auto: true

periods_per_year: auto
annualization_factor: auto
annualization_basis: trading
market: futures
execution_model: open_to_open
min_trades_required: 3

early_exit:
  enabled: false
  max_drawdown: 0.50
  check_bars: 50

segmentation:
  mode: legacy
  n_parts: 7

export:
  diagnostics: true
  signals: true
  false_start: true
  cycle: true
  trades: true
  false_start_max_bars: 4
  diagnostics_v2: true
  diagnostics_v2_flags:
    index: true
    reproducibility: true
    dashboard: true
    run_health: true
    trade_analytics: true
    equity_drawdown: true
    filter_funnel: true
    filter_attribution: true
    cycle_summary: true
    cost_sensitivity: true
    remediation: true
    filter_diagnostics_sampled: true
    # Reserved by the schema; these sheets are not implemented yet.
    returns_calendar: false
    exit_quality: false
    false_start_2: false
    data_dictionary: false
    robustness: false

trade_filter:
  enabled: true

  zigzag:
    enabled: false

  time_filter:
    enabled: true
    windows:
      - "09:00-12:00"
      - "16:00-18:00"

  volume:
    enabled: false

  wakeup_regime:
    enabled: false
