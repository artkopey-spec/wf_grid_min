# Tester config: zigzag_st_mode D + wakeup_regime (full diagnostics export)
# Run: python run_batch_tester.py --csv data.csv --config config_tester.yaml

supertrend:
  atr_period: 50
  multiplier: 2.5

trade_mode: revers
period: false

commission: 0.0000

warmup_period: 0
warmup_period_auto: true

periods_per_year: 252
annualization_factor: 252
annualization_basis: trading
market: futures
execution_model: open_to_open
min_trades_required: 3

early_exit:
  enabled: false
  max_drawdown: 0.50
  check_bars: 50

segmentation:
  mode: legacy
  n_parts: 7

export:
  diagnostics: true
  signals: true
  false_start: true
  cycle: true
  trades: true
  false_start_max_bars: 4
  diagnostics_v2: false
  diagnostics_v2_flags:
    index: false
    reproducibility: false
    dashboard: false
    run_health: false
    trade_analytics: false
    equity_drawdown: false
    filter_funnel: false
    filter_attribution: false
    cycle_summary: false
    cost_sensitivity: false
    remediation: false
    filter_diagnostics_sampled: false
    returns_calendar: false
    exit_quality: false
    false_start_2: false
    data_dictionary: false
    robustness: false

trade_filter:
  enabled: true
  type: zigzag_st_mode

  diagnostics:
    export_state_columns: true
    export_trigger_columns: true

  zigzag:
    enabled: true
    mode: D
    global_stats_source: full_dataset
    leg_height_mode: pct
    reversal_threshold: 0.001
    candidate_trigger_threshold: 0.012
    global_median: auto
    local_window: 5
    daily_reset: false
    # Supported only with candidate_trigger_threshold: auto.
    # candidate_trigger_quantile: 0.60
    # Deprecated by validator; kept here only as a schema note.
    # candidate_entry: false
    candidate_duration_gate:
      enabled: false
      # Valid only when enabled: true; validator rejects max_bars when disabled.
      # max_bars: 30

  # Legacy triggers are supported by the schema, but rejected with exit_off_mode: "exit C".
  # triggers:
  #   candidate_threshold:
  #     enabled: true
  #   confirmed_median:
  #     enabled: true

  lifecycle:
    freeze_confirmed_legs: 3
    stop_check: confirm_bar_only
    stopping_exit: opposite_st_flip
    exit_off_mode: "exit C"
    # Valid only with exit_off_mode: "exit B"; rejected with exit C.
    # exit_off_zz_leg_count: 2
    # exit_b_immediate_off: false

  time_filter:
    enabled: false
    window: "09:00-19:00"

  volume:
    enabled: false
    mode: volume_A
    aggregation: mean
    daily_reset: true
    cycle_direction_gate: false
    short_window: 10
    baseline_window: 1000
    threshold_ratio: 1.6
    exit_hysteresis_ratio: 1.6
    exit_freeze_bars: 5
    regime_low_ratio: 0.8
    regime_high_ratio: 1.2
    direction_lookback_bars: 5
    baseline_session:
      enabled: false
      window: "09:00-19:00"

  wakeup_regime:
    enabled: true
    lock_cycle_direction: false
    entry:
      direction_mode: inverse
      candidate_height:
        enabled: true
        quantile: 0.4
      candidate_age:
        enabled: false
        max_bars: 10
      atr_expansion:
        enabled: false
        short_window: 30
        long_window: 400
        min_ratio: 1.6
      volume_expansion:
        enabled: false
        short_window: 10
        baseline_window: 1000
        min_ratio: 0.5

    exit:
      ttl:
        enabled: true
        bars: 90
      no_fresh_candidate:
        enabled: false
        quantile: 0.60
        max_age_bars: 15
        timeout_bars: 20
      max_trades_per_cycle:
        enabled: true
        max_trades: 1
      cycle_take_profit:
        enabled: false
        pnl_pct: 0.01
      local_median_stop:
        enabled: false
      action:
        mode: close_position

    position_freeze:
      enabled: true
      min_hold_bars: 1
      apply_to: internal_opposite_st_flip
      release_action: apply_if_still_opposite
