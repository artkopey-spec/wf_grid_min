schema_version: 1
# WF Grid profile for the current data.csv.
# Data snapshot: 422725 MIX 1m bars, 2024-10-10 10:00 to 2026-08-05 12:46 MSK.
# 541 active days; median 860 bars/day. QUIK columns include OHLC and volume.
# WF windows: 63000 train bars / 21000 test bars / 21000 step bars (3:1, anchor=end).
# Run: python run.py --config config.yaml

data:
  file_path: "data.csv"
  periods_per_year: "auto"
  annualization_basis: "trading"

optimization:
  atr_period_range: [10, 80]
  multiplier_range: [1.0, 4.0]
  multiplier_step: 0.2
  atr_period_step: 3
  trade_mode: "revers"

backtest:
  # MIX commission per operation: 8.15 RUB / ~228275 RUB contract value.
  commission: 0.0000357025
  min_trades_required: 3
  early_exit_enabled: false
  early_exit_max_drawdown: 0.50
  early_exit_check_bars: 50

validation:
  warmup_period: 0
  warmup_period_auto: true
  walk_forward:
    train_size: "63000bars"
    test_size: "21000bars"
    step_size: "21000bars"
    scheme: "rolling"
    anchor: "end"
    min_train_bars: 63000
    min_test_bars: 21000

gates:
  step:
    min_trades: 3
    max_drawdown_threshold: -0.50
  candidate:
    positive_median_threshold: 0.0
    min_trades_median: 8.0
    worst_segment_pnl_threshold: -15.0
    max_drawdown_threshold: -0.45
    min_total_trades: 500
    min_ok_ratio: 0.80

ranking:
  mode: "gates_score"
  min_segments_for_ranking: null
  sort_by: "sum_pnl_pct_Median"
  tiebreaker: "sum_pnl_pct_Min"

scoring:
  normalization_mode: "rank"
  min_passed_for_discrimination: 10
  low_spread_threshold: 0.25
  score_weights:
    sum_pnl_pct_Median:        0.42
    profitable_segments_count: 0.34
    abs_max_drawdown_Median:   0.12
    abs_max_drawdown_Min:      0.12

status:
  min_meaningful_bars: 100

bucket:
  atr_bucket_step: 9
  mult_bucket_step: 0.6
  min_buckets_for_median: 5

execution:
  parallel_enabled: true
  max_workers: null
  chunksize: null
  fallback_to_sequential: true

export:
  retain_per_bar_filter_diagnostics: false

trade_filter:
  enabled: false
  # type: "zigzag_st_mode"  # uncomment when enabling zigzag

  zigzag:
    enabled: false
    # global_stats_source: "full_dataset"
    # leg_height_mode: "pct"
    # reversal_threshold: 0.0005
    # candidate_trigger_threshold: auto
    # candidate_trigger_quantile: 0.80
    # global_median: "auto"
    # local_window: 5
    # daily_reset: true
    # mode: "A+B"
    # candidate_duration_gate:
    #   enabled: false
    #   max_bars: 30

  # lifecycle:                        # needed only when zigzag.enabled: true
  #   freeze_confirmed_legs: 3
  #   stop_check: "confirm_bar_only"
  #   stopping_exit: "opposite_st_flip"
  #   exit_off_mode: "exit A"
  #   exit_off_zz_leg_count: 5
  #   exit_b_immediate_off: false

  # diagnostics:                      # needed only when zigzag.enabled: true
  #   export_state_columns: true
  #   export_trigger_columns: true

  time_filter:
    enabled: true
    window: "09:00-19:00"

  volume:
    enabled: false
    mode: "volume_A"
    aggregation: median
    daily_reset: true
    cycle_direction_gate: false
    short_window: 25
    baseline_window: 500
    threshold_ratio: 1.6
    exit_hysteresis_ratio: 1.6
    exit_freeze_bars: 5
    regime_low_ratio: 0.8
    regime_high_ratio: 1.2
    direction_lookback_bars: 10
    baseline_session:
      enabled: false
      window: "09:00-19:00"
