schema_version: 1
# WF Grid profile for the current data.csv.
# Data snapshot: 190620 SBER OHLCV bars across 1112 calendar dates,
# 2023-01-03 10:00 to 2026-11-05 23:45 MSK.
# Source columns: FINAM DATE/TIME, OHLC and VOL.
# WF windows: 29307 train bars / 9769 test bars / 9769 step bars
# (3:1, anchor=end, 16 steps; 5009 leading bars outside the windows).
# Run: python run.py --config config.yaml

data:
  file_path: "data.csv"
  periods_per_year: "auto"
  annualization_basis: "trading"

optimization:
  atr_period_range: [10, 40]
  multiplier_range: [1.0, 4.0]
  multiplier_step: 0.2
  atr_period_step: 1
  trade_mode: "revers"

backtest:
  # Commission per transaction side (fraction).
  commission: 0.0000667
  min_trades_required: 3
  early_exit_enabled: false
  early_exit_max_drawdown: 0.50
  early_exit_check_bars: 10

validation:
  warmup_period: 0.0
  warmup_period_auto: true
  walk_forward:
    train_size: "29307bars"
    test_size: "9769bars"
    step_size: "9769bars"
    scheme: "rolling"
    anchor: "end"
    min_train_bars: 29307
    min_test_bars: 9769

gates:
  step:
    min_trades: 2
    max_drawdown_threshold: -0.60
  candidate:
    positive_median_threshold: -1.0
    min_trades_median: 5.0
    worst_segment_pnl_threshold: -20.0
    max_drawdown_threshold: -0.55
    # Exploratory profile: at least 40 trades across valid OOS steps.
    min_total_trades: 40
    # With 16 WF steps, 0.66 requires at least 11 valid steps.
    min_ok_ratio: 0.66

ranking:
  mode: "gates_score"
  min_segments_for_ranking: null
  sort_by: "sum_pnl_pct_Median"
  tiebreaker: "sum_pnl_pct_Min"

scoring:
  normalization_mode: "rank"
  min_passed_for_discrimination: 10
  low_spread_threshold: 0.25
  score_weights:
    sum_pnl_pct_Median:        0.42
    profitable_segments_count: 0.34
    abs_max_drawdown_Median:   0.12
    abs_max_drawdown_Min:      0.12

status:
  min_meaningful_bars: 20

bucket:
  atr_bucket_step: 2
  mult_bucket_step: 0.6
  min_buckets_for_median: 5

execution:
  parallel_enabled: true
  max_workers: null
  chunksize: null
  fallback_to_sequential: true

export:
  retain_per_bar_filter_diagnostics: false

trade_filter:
  enabled: true

  date_filter:
    enabled: false
    file_path: "data 1.csv"

  zigzag:
    enabled: false

  time_filter:
    enabled: true
    windows:
      - "09:00-14:00"

  volume:
    enabled: false

  wakeup_regime:
    enabled: false
